name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# a new push to a pull request supersedes the runs still in flight for it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # keep checking the other runtimes when one of them fails
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      # every case runs against express and against fulmine, and the two have to agree
      - name: Test on both servers
        run: npm test
